<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 to-purple-100 p-4 sm:p-8">

    <div class="max-w-3xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-xl">

        <h1 class="text-3xl font-bold text-center text-indigo-700 mb-2">
            Student Attendance
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Manage your daily classroom attendance
        </p>

        <!-- Add Student -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <input type="text" id="studentName" placeholder="Enter student name"
                class="flex-1 min-w-0 border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-400">

            <button onclick="addStudent()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-lg">
                Add Student
            </button>
        </div>

        <!-- Summary -->
        <div class="grid grid-cols-3 gap-3 mb-6 text-center">

            <div class="bg-blue-50 p-3 rounded-xl">
                <p class="text-sm text-gray-500">Total</p>
                <h2 id="total" class="text-2xl font-bold text-blue-600">0</h2>
            </div>

            <div class="bg-green-50 p-3 rounded-xl">
                <p class="text-sm text-gray-500">Present</p>
                <h2 id="present" class="text-2xl font-bold text-green-600">0</h2>
            </div>

            <div class="bg-red-50 p-3 rounded-xl">
                <p class="text-sm text-gray-500">Absent</p>
                <h2 id="absent" class="text-2xl font-bold text-red-600">0</h2>
            </div>

        </div>

        <!-- Student List -->
        <h2 class="text-xl font-bold mb-4">Student List</h2>

        <div id="studentList" class="space-y-3"></div>

        <p id="emptyMessage" class="text-center text-gray-400 py-6">
            No students added yet.
        </p>

    </div>

    <script>
        let students = [];
        let nextId = 1;

        function addStudent() {
            const input = document.getElementById("studentName");
            const name = input.value.trim();

            if (name === "") {
                alert("Please enter a student name!");
                return;
            }

            students.push({
                id: nextId++,
                name: name,
                present: false
            });

            input.value = "";
            input.focus();

            displayStudents();
        }

        function markAttendance(id, status) {
            const student = students.find(s => s.id === id);

            if (student) {
                student.present = status;
                displayStudents();
            }
        }

        function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            displayStudents();
        }

        function displayStudents() {
            const list = document.getElementById("studentList");
            list.replaceChildren();

            students.forEach(student => {
                const row = document.createElement("div");
                row.className =
                    "flex flex-wrap items-center justify-between gap-3 bg-gray-50 p-4 rounded-xl border";

                const name = document.createElement("span");
                name.className = "font-semibold break-words";
                name.textContent = student.name;

                const actions = document.createElement("div");
                actions.className = "flex flex-wrap gap-2";

                const presentBtn = document.createElement("button");
                presentBtn.textContent = "Present";
                presentBtn.className =
                    "px-3 py-2 rounded-lg text-sm text-white " +
                    (student.present ? "bg-green-700" : "bg-green-500 hover:bg-green-600");

                presentBtn.onclick = () =>
                    markAttendance(student.id, true);

                const absentBtn = document.createElement("button");
                absentBtn.textContent = "Absent";
                absentBtn.className =
                    "px-3 py-2 rounded-lg text-sm text-white " +
                    (!student.present ? "bg-red-700" : "bg-red-500 hover:bg-red-600");

                absentBtn.onclick = () =>
                    markAttendance(student.id, false);

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.className =
                    "px-3 py-2 rounded-lg text-sm bg-gray-200 hover:bg-gray-300";

                deleteBtn.onclick = () =>
                    deleteStudent(student.id);

                actions.append(presentBtn, absentBtn, deleteBtn);
                row.append(name, actions);
                list.appendChild(row);
            });

            const presentCount = students.filter(s => s.present).length;

            document.getElementById("total").textContent =
                students.length;

            document.getElementById("present").textContent =
                presentCount;

            document.getElementById("absent").textContent =
                students.length - presentCount;

            document.getElementById("emptyMessage").style.display =
                students.length === 0 ? "block" : "none";
        }

        document.getElementById("studentName").addEventListener(
            "keydown", function (event) {
                if (event.key === "Enter") {
                    addStudent();
                }
            }
        );

        displayStudents();
    </script>

</body>

</html>
